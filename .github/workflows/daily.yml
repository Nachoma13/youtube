name: 🤖 Publicar vídeo diario en YouTube
 
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
 
jobs:
  publicar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
 
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
 
      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: 🔧 Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
 
      - name: 📦 Instalar librerías Python
        run: |
          pip install --upgrade pip
          pip install \
            edge-tts \
            pillow \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth
 
      - name: 🚀 Ejecutar agente
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN:    ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID:        ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:    ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python agent.py
 
      - name: 💾 Guardar registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-videos-${{ github.run_number }}
          path: output/registro.jsonl
          retention-days: 90
          if-no-files-found: ignore
