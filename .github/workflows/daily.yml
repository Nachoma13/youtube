name: 🤖 Publicar vídeo diario en YouTube

on:
  schedule:
    # Cada día a las 10:00 AM hora España (UTC+2 → 08:00 UTC)
    - cron: "0 8 * * *"

  # También permite lanzar manualmente desde GitHub
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Código
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # ── Python
      - name: 🐍 Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Dependencias del sistema para MoviePy
      - name: 🔧 Instalar ffmpeg
        run: sudo apt-get install -y ffmpeg fonts-dejavu

      # ── Dependencias Python
      - name: 📦 Instalar librerías
        run: |
          pip install --upgrade pip
          pip install \
            anthropic \
            edge-tts \
            "moviepy==1.0.3" \
            pillow \
            requests \
            google-api-python-client \
            google-auth-oauthlib

      # ── Ejecutar el agente
      - name: 🚀 Ejecutar agente
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN:    ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID:        ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:    ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python agent.py

      # ── Guardar el registro de vídeos publicados
      - name: 💾 Guardar registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-${{ github.run_number }}
          path: output/registro.jsonl
          retention-days: 90
