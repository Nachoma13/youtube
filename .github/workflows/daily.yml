name: 🤖 Publicar vídeo diario en YouTube

on:
  schedule:
    # Cada día a las 10:00 AM hora España (UTC+2 en verano → 08:00 UTC)
    - cron: "0 8 * * *"

  # Permite lanzar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  publicar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Descargar el código del repo
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Configurar Python
      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Herramientas del sistema (ffmpeg para MoviePy, fuentes para Pillow)
      - name: 🔧 Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      # ── 4. Dependencias Python
      - name: 📦 Instalar librerías Python
        run: |
          pip install --upgrade pip
          pip install \
            openai \
            edge-tts \
            "moviepy==1.0.3" \
            pillow \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth

      # ── 5. Ejecutar el agente
      - name: 🚀 Ejecutar agente
        env:
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN:    ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID:        ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:    ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python agent.py

      # ── 6. Guardar el registro de vídeos publicados como artefacto
      - name: 💾 Guardar registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-videos-${{ github.run_number }}
          path: output/registro.jsonl
          retention-days: 90
          if-no-files-found: ignore
