name: 🎬 Lote 1 — 08:00h (vídeos 1-5)
 
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
 
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: 🔧 Sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
 
      - name: 📦 Librerías Python
        run: |
          pip install --upgrade pip
          pip install \
            "TTS==0.22.0" \
            pillow \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth
 
      - name: 📥 Pre-descargar modelo de voz
        run: |
          python -c "from TTS.api import TTS; TTS('tts_models/es/css10/vits', progress_bar=False)"
 
      - name: 🚀 Ejecutar lote
        env:
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python agent.py
 
      - name: 💾 Registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-lote1-${{ github.run_number }}
          path: output/registro.jsonl
          retention-days: 30
          if-no-files-found: ignore
